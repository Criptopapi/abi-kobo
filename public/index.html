<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abi Kôbô - Repostería Artesanal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FFF5F7; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyACU4JVaFfmS0nBUZA3dYoBFuqtkkY5-8o",
            authDomain: "abi-kobo.firebaseapp.com",
            projectId: "abi-kobo",
            storageBucket: "abi-kobo.firebasestorage.app",
            messagingSenderId: "85839848649",
            appId: "1:85839848649:web:7570e39aaa066bd51e5918"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = app.firestore();

        // --- UTILIDADES ---
        const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_SIZE = 200;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        const sendTelegramMessage = async (order) => {
            const text = `🥟 NUEVO PEDIDO - ABI KÔBÔ (Cód: ${order.code})\n\n👤 Cliente: ${order.client}\n📦 Pedido: ${order.items}\n💰 Total: S/ ${order.total.toFixed(2)}\n\n✅ Comprobante subido en la plataforma.`;
            try {
                await fetch('/api/send-telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
            } catch (e) { console.error("Error Telegram:", e); }
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [route, setRoute] = useState(window.location.hash);
            const [products, setProducts] = useState([]);
            const [clientConfig, setClientConfig] = useState({ yapeNumber: '', yapeQR: '' });
            const [superadminConfig, setSuperadminConfig] = useState({ yapeNumber: '', yapeQR: '' });
            const [schedule, setSchedule] = useState({ deadline: null, deliveryInfo: '' });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                window.addEventListener('hashchange', () => setRoute(window.location.hash));
                
                const unsubProducts = db.collection('products').orderBy('order', 'asc').onSnapshot(snapshot => {
                    setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setLoading(false);
                });

                db.collection('config').doc('client_payment').onSnapshot(doc => { if (doc.exists) setClientConfig(doc.data()); });
                db.collection('config').doc('superadmin_payment').onSnapshot(doc => { if (doc.exists) setSuperadminConfig(doc.data()); });
                db.collection('config').doc('schedule').onSnapshot(doc => { if (doc.exists) setSchedule(doc.data()); });

                db.collection('products').get().then(snapshot => {
                    if(snapshot.empty) {
                        const initialData = [
                            { code: "E1", name: "Empanada de Carne", price: 6.50, img: "https://images.unsplash.com/photo-1601050690597-df0568f70950?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 50, order: 1 },
                            { code: "E2", name: "Empanada de Pollo", price: 6.50, img: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 50, order: 2 },
                            { code: "E3", name: "Empanada de Pizza", price: 7.00, img: "https://images.unsplash.com/photo-1607305387299-a3d9611cd469?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 50, order: 3 },
                            { code: "E4", name: "Empanada Jamón y Queso", price: 7.00, img: "https://images.unsplash.com/photo-1606755456206-b25f2b09a0d6?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 50, order: 4 },
                            { code: "E5", name: "Empanada Hawaiana", price: 7.00, img: "https://images.unsplash.com/photo-1544025162-d76694265947?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 50, order: 5 },
                            { code: "E6", name: "Empanada Mexicana", price: 7.00, img: "https://images.unsplash.com/photo-1565299505782-97dab53f9b24?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 50, order: 6 },
                            { code: "E7", name: "Empanada Vegetariana", price: 7.00, img: "https://images.unsplash.com/photo-1606491956689-2ea7a6f59d47?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 50, order: 7 }
                        ];
                        initialData.forEach(p => db.collection('products').add(p));
                    }
                });

                return () => unsubProducts();
            }, []);

            const goAdmin = () => { window.location.hash = '#admin'; setRoute('#admin'); };
            const goSuperAdmin = () => { window.location.hash = '#superadmin'; setRoute('#superadmin'); };
            const goClient = () => { window.location.hash = ''; setRoute(''); };

            if (loading) return <div className="min-h-screen flex items-center justify-center text-pink-500 font-poppins font-bold">CARGANDO...</div>;

            if (route === '#superadmin') return <SuperAdminApp onBackClick={goClient} superadminConfig={superadminConfig} />;
            if (route === '#admin') return <AdminApp onBackClick={goClient} products={products} clientConfig={clientConfig} superadminConfig={superadminConfig} schedule={schedule} />;
            
            return <ClientApp onAdminClick={goAdmin} products={products} clientConfig={clientConfig} schedule={schedule} />;
        }

        // --- VISTA DEL CLIENTE ---
        function ClientApp({ onAdminClick, products, clientConfig, schedule }) {
            const [cart, setCart] = useState([]);
            const [view, setView] = useState('home');
            const [clientName, setClientName] = useState('');
            const [receipt, setReceipt] = useState(null);
            const [error, setError] = useState('');
            const [loadingOrder, setLoadingOrder] = useState(false);
            const [lastOrderInfo, setLastOrderInfo] = useState(null);

            const isDeadlinePassed = schedule.deadline ? (Date.now() > schedule.deadline) : true;

            const availableProducts = products.filter(p => p.stock > 0);

            const addToCart = (product) => {
                if (isDeadlinePassed) return;
                const existing = cart.find(item => item.id === product.id);
                if (existing && existing.qty >= product.stock) return;
                if (existing) setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
                else setCart([...cart, { ...product, qty: 1 }]);
            };

            const decreaseQty = (id) => {
                const existing = cart.find(item => item.id === id);
                if (existing.qty === 1) setCart(cart.filter(item => item.id !== id));
                else setCart(cart.map(item => item.id === id ? { ...item, qty: item.qty - 1 } : item));
            };

            const removeItem = (id) => setCart(cart.filter(item => item.id !== id));
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

            const handleReceiptFile = (e) => {
                const file = e.target.files[0];
                if(file) compressImage(file, (src) => setReceipt(src));
            };

            const copyYapeNumber = () => {
                if(clientConfig.yapeNumber) {
                    navigator.clipboard.writeText(clientConfig.yapeNumber.replace(/\s/g, ''));
                    alert("¡Número copiado! Ábrelo en tu app de Yape.");
                }
            };

            const confirmOrder = async () => {
                setError('');
                if(!clientName || !receipt) {
                    setError("⚠️ Falta tu nombre o el comprobante de Yape.");
                    return;
                }
                setLoadingOrder(true);
                try {
                    const orderCode = "AK-" + Date.now().toString().slice(-6);
                    const orderData = {
                        code: orderCode,
                        client: clientName,
                        items: cart.map(p => `${p.name} (x${p.qty})`).join(", "),
                        total: totalPrice,
                        status: "Recibido",
                        receipt: receipt,
                        createdAt: Date.now()
                    };
                    
                    await db.collection('orders').add(orderData);
                    await sendTelegramMessage(orderData);

                    const batch = db.batch();
                    cart.forEach(item => {
                        const productRef = db.collection('products').doc(item.id);
                        batch.update(productRef, { stock: item.stock - item.qty });
                    });
                    await batch.commit();
                    
                    setLastOrderInfo({ code: orderCode, summary: orderData.items, total: totalPrice });
                    setCart([]); setClientName(''); setReceipt(null);
                    setView('success');
                } catch (err) {
                    console.error(err);
                    setError("❌ Error al guardar el pedido. Intenta nuevamente.");
                } finally {
                    setLoadingOrder(false);
                }
            };

            if(view === 'success' && lastOrderInfo) {
                return (
                    <div className="max-w-md mx-auto p-8 text-center bg-pink-50 min-h-screen flex flex-col justify-center">
                        <h2 className="text-3xl font-poppins font-bold text-pink-600 mb-2">¡PEDIDO RECIBIDO! 🌸</h2>
                        <p className="text-gray-600 mb-6">Abi Kôbô ha registrado tu pedido.</p>
                        
                        <div className="bg-white p-5 rounded-2xl border border-pink-200 mb-6 text-left shadow-sm">
                            <p className="text-center text-pink-600 font-poppins text-xl font-bold mb-4">CÓDIGO: {lastOrderInfo.code}</p>
                            <div className="border-t border-pink-100 pt-3 space-y-1">
                                <p className="text-sm text-gray-400">Resumen del pedido:</p>
                                <p className="text-gray-800 text-sm">{lastOrderInfo.summary}</p>
                                <p className="text-pink-600 font-bold text-lg mt-2">Total: S/ {lastOrderInfo.total.toFixed(2)}</p>
                                <p className="text-gray-500 text-xs mt-2">Recuerda: Entrega este {schedule.deliveryInfo || 'Jueves'}.</p>
                            </div>
                        </div>

                        <p className="text-gray-400 text-xs mb-6">📸 Toma una captura de pantalla a este comprobante por si acaso.</p>
                        
                        <button onClick={() => { setView('home'); setLastOrderInfo(null); }} className="bg-pink-600 text-white py-3 px-8 rounded-xl font-bold hover:bg-pink-700 mb-2">Volver al Menú</button>
                        <button onClick={onAdminClick} className="text-sm text-gray-400 underline">Ver Panel Admin</button>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen relative pb-28 border-x border-pink-100">
                    <header className="p-4 flex justify-between items-center bg-white border-b-2 border-pink-200 sticky top-0 z-20 shadow-sm">
                        <div>
                            <h1 className="text-xl font-poppins font-bold tracking-wide text-pink-600">Abi Kôbô</h1>
                            <p className="text-[10px] text-gray-400 tracking-widest uppercase">Repostería Artesanal</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={onAdminClick} className="text-gray-300 text-xs hover:text-pink-400">⚙️ Admin</button>
                            <div className="bg-pink-100 border border-pink-300 px-3 py-1 rounded-lg flex items-center gap-2">
                                <span className="text-pink-600 text-sm font-bold">🛒 {totalQty}</span>
                            </div>
                        </div>
                    </header>

                    {/* Schedule Banner */}
                    <div className={`p-3 text-center text-sm ${isDeadlinePassed ? 'bg-gray-200 text-gray-600' : 'bg-pink-100 text-pink-800'}`}>
                        {isDeadlinePassed ? (
                            `Pedidos cerrados por ahora. Próxima entrega: ${schedule.deliveryInfo || 'Por confirmar'}`
                        ) : (
                            `Pedidos abiertos hasta ${new Date(schedule.deadline).toLocaleString()} - Entrega: ${schedule.deliveryInfo || 'Por confirmar'}`
                        )}
                    </div>

                    <div className="p-4 bg-pink-50 min-h-[calc(100vh-120px)]">
                        {availableProducts.length === 0 ? (
                            <div className="text-center text-gray-400 mt-20 font-poppins">MENÚ NO DISPONIBLE</div>
                        ) : (
                            <div className="grid grid-cols-2 gap-4">
                                {availableProducts.map(p => {
                                    const itemInCart = cart.find(item => item.id === p.id);
                                    return (
                                        <div key={p.id} className={`bg-white rounded-xl overflow-hidden border-2 ${itemInCart ? 'border-pink-500 shadow-[0_0_15px_rgba(236,72,153,0.2)]' : 'border-gray-100'} shadow-sm`}>
                                            <div className="relative">
                                                <img src={p.img} alt={p.name} className="w-full aspect-square object-cover" />
                                            </div>
                                            <div className="p-2">
                                                <h3 className="font-semibold text-xs text-gray-800 h-8 overflow-hidden">{p.name}</h3>
                                                <div className="flex justify-between items-center mt-1">
                                                    <span className="text-pink-600 font-poppins font-bold text-sm">S/ {p.price.toFixed(2)}</span>
                                                </div>
                                                {itemInCart ? (
                                                    <div className="flex items-center justify-between mt-2 bg-pink-50 rounded-lg p-1">
                                                        <button onClick={() => decreaseQty(p.id)} disabled={loadingOrder} className="text-white bg-gray-400 w-6 h-6 rounded font-bold flex items-center justify-center disabled:opacity-30">-</button>
                                                        <span className="text-gray-800 font-bold text-sm">{itemInCart.qty}</span>
                                                        <button onClick={() => addToCart(p)} disabled={itemInCart.qty >= p.stock || loadingOrder || isDeadlinePassed} className="text-white bg-pink-500 w-6 h-6 rounded font-bold flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed">+</button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => addToCart(p)} disabled={loadingOrder || isDeadlinePassed} className="w-full mt-2 bg-white text-pink-600 text-xs py-1.5 rounded-lg font-bold border border-pink-300 hover:bg-pink-50 disabled:opacity-30 disabled:cursor-not-allowed">+ Agregar</button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {view === 'checkout' && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-end justify-center z-50">
                            <div className="bg-white w-full max-w-md rounded-t-2xl p-6 max-h-[90vh] overflow-y-auto border-t-2 border-pink-300">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-poppins font-bold text-pink-600">TU PEDIDO</h2>
                                    <button onClick={() => setView('home')} className="text-gray-300 text-2xl">&times;</button>
                                </div>
                                
                                <div className="bg-gray-50 rounded-xl p-3 mb-4 border border-gray-100">
                                    {cart.length === 0 ? ( <p className="text-gray-400 text-center text-sm py-4">Carrito vacío</p> ) : (
                                        cart.map((item) => (
                                            <div key={item.id} className="flex items-center gap-2 py-2 border-b border-gray-100 last:border-0">
                                                <img src={item.img} className="w-10 h-10 rounded object-cover" alt={item.name} />
                                                <div className="flex-1">
                                                    <p className="text-gray-800 text-sm font-semibold">{item.name}</p>
                                                    <p className="text-pink-500 text-xs">S/ {item.price.toFixed(2)} c/u</p>
                                                </div>
                                                <div className="flex items-center gap-2 bg-white rounded-lg p-1 border border-gray-200">
                                                    <button onClick={() => decreaseQty(item.id)} disabled={loadingOrder} className="text-white bg-gray-400 w-5 h-5 rounded text-xs font-bold flex items-center justify-center disabled:opacity-30">-</button>
                                                    <span className="text-gray-800 text-sm font-bold">{item.qty}</span>
                                                    <button onClick={() => addToCart(item)} disabled={item.qty >= item.stock || loadingOrder} className="text-white bg-pink-500 w-5 h-5 rounded text-xs font-bold flex items-center justify-center disabled:opacity-30">+</button>
                                                </div>
                                                <button onClick={() => removeItem(item.id)} disabled={loadingOrder} className="text-red-400 hover:text-red-500 ml-1 disabled:opacity-30">🗑️</button>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {cart.length > 0 && (
                                    <>
                                        <div className="flex justify-between font-poppins font-bold text-pink-600 mb-4 text-lg">
                                            <span>TOTAL</span><span>S/ {totalPrice.toFixed(2)}</span>
                                        </div>
                                        {error && <div className="bg-red-50 border border-red-200 text-red-500 text-sm p-2 rounded mb-4">{error}</div>}

                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-gray-400 mb-1">1. Paga a este Yape</label>
                                            <div className="bg-gray-50 p-3 rounded-xl flex flex-col items-center border border-gray-100">
                                                {clientConfig.yapeQR ? (
                                                    <img src={clientConfig.yapeQR} alt="QR Yape" className="w-32 h-32 mb-2 rounded object-cover" />
                                                ) : (
                                                    <p className="text-gray-300 text-xs my-4">El vendedor no ha configurado su QR.</p>
                                                )}
                                                {clientConfig.yapeNumber && (
                                                    <>
                                                        <p className="text-xs text-gray-400 mb-1">Toca para copiar el número:</p>
                                                        <button onClick={copyYapeNumber} className="bg-gray-100 text-pink-600 text-sm font-bold px-3 py-2 rounded-lg hover:bg-gray-200 w-full flex items-center justify-center gap-2">
                                                            <span>{clientConfig.yapeNumber}</span> 📋
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-gray-400 mb-1">2. Sube tu comprobante</label>
                                            <input type="file" accept="image/*" onChange={handleReceiptFile} className="w-full text-sm p-2 bg-gray-50 rounded-lg border border-gray-100 text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-pink-100 file:text-pink-600" />
                                            {receipt && <img src={receipt} className="w-16 h-16 object-cover mt-2 rounded-md" alt="Comprobante" />}
                                        </div>
                                        <div className="mb-6">
                                            <label className="block text-xs font-bold text-gray-400 mb-1">3. Tu Nombre</label>
                                            <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="Ej: Carlos" className="w-full p-2 rounded-lg border border-gray-100 bg-gray-50 text-gray-800 text-sm" />
                                        </div>
                                        <button onClick={confirmOrder} disabled={loadingOrder} className="w-full bg-pink-600 text-white py-3 rounded-xl font-poppins font-bold text-md hover:bg-pink-700 disabled:opacity-50 disabled:cursor-not-allowed">
                                            {loadingOrder ? 'Procesando...' : 'CONFIRMAR PEDIDO'}
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {cart.length > 0 && view !== 'checkout' && !isDeadlinePassed && (
                        <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 bg-white backdrop-blur border-t border-pink-100 shadow-md">
                            <button onClick={() => setView('checkout')} className="w-full bg-pink-600 text-white py-3 rounded-xl font-poppins font-bold text-md flex justify-between items-center px-6 hover:bg-pink-700">
                                <span>PAGAR AHORA</span>
                                <span>S/ {totalPrice.toFixed(2)}</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // --- VISTA ADMIN (ABI) ---
        function AdminApp({ onBackClick, products, clientConfig, superadminConfig, schedule }) {
            const [orders, setOrders] = useState([]);
            const [payments, setPayments] = useState([]);
            const [tab, setTab] = useState('pedidos');
            const [auth, setAuth] = useState(false);
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');
            const [modalReceipt, setModalReceipt] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            const [commReceipt, setCommReceipt] = useState(null);
            const [commAmount, setCommAmount] = useState('');
            const [commDate, setCommDate] = useState('');
            const [commRef, setCommRef] = useState('');
            const [commError, setCommError] = useState('');

            const [editYapeNumber, setEditYapeNumber] = useState(clientConfig.yapeNumber || '');
            const [editYapeQR, setEditYapeQR] = useState(clientConfig.yapeQR || null);
            const [editDeadline, setEditDeadline] = useState(schedule.deadline ? new Date(schedule.deadline - (new Date().getTimezoneOffset() * 60000)).toISOString().slice(0,16) : '');
            const [editDeliveryInfo, setEditDeliveryInfo] = useState(schedule.deliveryInfo || '');

            useEffect(() => {
                setEditYapeNumber(clientConfig.yapeNumber || '');
                setEditYapeQR(clientConfig.yapeQR || null);
                setEditDeadline(schedule.deadline ? new Date(schedule.deadline - (new Date().getTimezoneOffset() * 60000)).toISOString().slice(0,16) : '');
                setEditDeliveryInfo(schedule.deliveryInfo || '');
            }, [clientConfig, schedule]);

            useEffect(() => {
                if (auth) {
                    const unsubOrders = db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                        setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    const unsubPayments = db.collection('commission_payments').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                        setPayments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    return () => { unsubOrders(); unsubPayments(); };
                }
            }, [auth]);

            const login = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pass })
                    });
                    const data = await res.json();
                    if (data.success && data.role === 'admin') { setAuth(true); setError(''); }
                    else setError('Contraseña incorrecta');
                } catch (err) { setError('Error de conexión'); }
            };

            const updateOrderStatus = async (id, status) => { await db.collection('orders').doc(id).update({ status }); };
            const addNewProduct = async () => { 
                const newOrder = products.length > 0 ? Math.max(...products.map(p => p.order || 0)) + 1 : 1;
                await db.collection('products').add({ code: "N", name: "Nuevo", price: 1.00, img: "https://via.placeholder.com/150", stock: 0, order: newOrder }); 
            };
            const moveProduct = async (id, direction) => {
                const currentIndex = products.findIndex(p => p.id === id);
                const targetIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;
                if (targetIndex < 0 || targetIndex >= products.length) return; 
                const currentProduct = products[currentIndex];
                const targetProduct = products[targetIndex];
                const batch = db.batch();

        // Función auxiliar para CSV
        function downloadCSV(orders) {
            let csv = "Codigo,Fecha,Cliente,Pedido,Total,Estado\n";
            orders.forEach(o => {
                const date = new Date(o.createdAt).toLocaleString();
                csv += `"${o.code || 'N/A'}","${date}","${o.client}","${o.items}",${o.total.toFixed(2)},"${o.status}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "pedidos_abi_kobo.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- VISTA SUPERADMIN (TÚ) ---
        function SuperAdminApp({ onBackClick, superadminConfig }) {
            const [auth, setAuth] = useState(false);
            const [pass, setPass] = useState('');
            const [orders, setOrders] = useState([]);
            const [payments, setPayments] = useState([]);
            const [tab, setTab] = useState('dashboard');
            const [modalReceipt, setModalReceipt] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            const [editYapeNumber, setEditYapeNumber] = useState(superadminConfig.yapeNumber || '');
            const [editYapeQR, setEditYapeQR] = useState(superadminConfig.yapeQR || null);

            useEffect(() => {
                setEditYapeNumber(superadminConfig.yapeNumber || '');
                setEditYapeQR(superadminConfig.yapeQR || null);
            }, [superadminConfig]);

            useEffect(() => {
                if (auth) {
                    const unsubOrders = db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                        setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    const unsubPayments = db.collection('commission_payments').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                        setPayments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    return () => { unsubOrders(); unsubPayments(); };
                }
            }, [auth]);

            const login = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pass })
                    });
                    const data = await res.json();
                    if (data.success && data.role === 'superadmin') { setAuth(true); }
                    else alert("Contraseña incorrecta");
                } catch (err) { alert('Error de conexión'); }
            };

            const approvePayment = async (id) => { await db.collection('commission_payments').doc(id).update({ status: "Aprobado" }); };
            const rejectPayment = async (id) => { await db.collection('commission_payments').doc(id).update({ status: "Rechazado" }); };

            const resetAdminPlatform = async () => {
                if(confirm("⚠️ ¿Borrar TODOS los pedidos y pagos de Abi? Esto reiniciará su panel a cero.")) {
                    const ordersSnap = await db.collection('orders').get();
                    ordersSnap.forEach(doc => doc.ref.delete());
                    const paymentsSnap = await db.collection('commission_payments').get();
                    paymentsSnap.forEach(doc => doc.ref.delete());
                    alert("Plataforma del Admin reseteada exitosamente.");
                }
            };

            const resetGlobalPlatform = async () => {
                if(confirm("🚨 PELIGRO: ¿Borrar TODO (Pedidos, Pagos, Productos y Configuraciones)? La app quedará como recién instalada.")) {
                    const ordersSnap = await db.collection('orders').get();
                    ordersSnap.forEach(doc => doc.ref.delete());
                    const paymentsSnap = await db.collection('commission_payments').get();
                    paymentsSnap.forEach(doc => doc.ref.delete());
                    const productsSnap = await db.collection('products').get();
                    productsSnap.forEach(doc => doc.ref.delete());
                    alert("Plataforma Global reseteada. Volviendo a estado de fábrica...");
                }
            };

            const handleSuperadminQRFile = (e) => {
                const file = e.target.files[0];
                if (file) compressImage(file, (src) => setEditYapeQR(src));
            };

            const saveSuperadminConfig = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('config').doc('superadmin_payment').set({ yapeNumber: editYapeNumber, yapeQR: editYapeQR });
                    alert("Tu configuración de cobro guardada.");
                } catch (err) { console.error(err); alert("Error al guardar."); }
            };

            if (!auth) {
                return (
                    <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-4">
                        <form onSubmit={login} className="bg-gray-800 p-6 rounded-xl border border-pink-500 w-full max-w-sm">
                            <h2 className="text-xl font-poppins font-bold text-pink-500 mb-4 text-center">SUPERADMIN PANEL</h2>
                            <input type="password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="Master Password" className="w-full p-2 rounded-lg border border-gray-700 bg-gray-900 text-white mb-2" autoFocus />
                            <button type="submit" className="w-full bg-pink-600 text-white py-2 rounded-lg font-bold">Acceder</button>
                            <button onClick={onBackClick} className="w-full text-gray-500 text-sm mt-2 hover:underline">← Volver</button>
                        </form>
                    </div>
                );
            }

            const validOrders = orders.filter(o => o.status !== "Anulado");
            const totalSalesAllTime = validOrders.filter(o => o.status === "Entregado").reduce((sum, o) => sum + o.total, 0);
            const totalCommissionAllTime = totalSalesAllTime * 0.05;
            const approvedPayments = payments.filter(p => p.status === "Aprobado");
            const totalPaid = approvedPayments.reduce((sum, p) => sum + (Number(p.amountPaid) || 0), 0);
            const currentDebt = totalCommissionAllTime - totalPaid;

            const filteredOrders = orders.filter(o => {
                const term = searchTerm.toLowerCase();
                return (o.code || '').toLowerCase().includes(term) ||
                       o.client.toLowerCase().includes(term) || 
                       o.items.toLowerCase().includes(term) ||
                       o.status.toLowerCase().includes(term) ||
                       new Date(o.createdAt).toLocaleString().includes(term);
            });

            return (
                <div className="min-h-screen bg-gray-900 font-inter p-4 text-white relative">
                    {modalReceipt && (
                        <div className="fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4" onClick={() => setModalReceipt(null)}>
                            <img src={modalReceipt} className="max-w-full max-h-full rounded-lg" alt="Comprobante" />
                            <button className="absolute top-4 right-4 text-white text-4xl">&times;</button>
                        </div>
                    )}
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-center mb-6 border-b border-pink-500 pb-4">
                            <div>
                                <h2 className="text-xl font-poppins font-bold text-pink-500">SUPERADMIN DASHBOARD</h2>
                                <p className="text-sm text-gray-500">Control de Plataforma SaaS</p>
                            </div>
                            <button onClick={onBackClick} className="text-sm text-gray-400 hover:text-white border border-gray-700 px-3 py-1 rounded">← Salir</button>
                        </div>

                        <div className="flex gap-2 mb-6">
                            <button onClick={() => setTab('dashboard')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'dashboard' ? 'bg-pink-600 text-white' : 'bg-gray-800 text-gray-400'}`}>Resumen</button>
                            <button onClick={() => setTab('pagos')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'pagos' ? 'bg-pink-600 text-white' : 'bg-gray-800 text-gray-400'}`}>Aprobación de Pagos</button>
                            <button onClick={() => setTab('config')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'config' ? 'bg-pink-600 text-white' : 'bg-gray-800 text-gray-400'}`}>Config. Pagos</button>
                        </div>

                        {tab === 'dashboard' && (
                            <>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
                                        <p className="text-gray-400 text-xs">Ventas Históricas (Plataforma)</p>
                                        <p className="text-2xl font-bold text-white">S/ {totalSalesAllTime.toFixed(2)}</p>
                                    </div>
                                    <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
                                        <p className="text-gray-400 text-xs">Comisión Total Generada</p>
                                        <p className="text-2xl font-bold text-white">S/ {totalCommissionAllTime.toFixed(2)}</p>
                                    </div>
                                    <div className="bg-gray-800 p-4 rounded-xl border border-pink-500">
                                        <p className="text-gray-400 text-xs">Deuda Actual de Abi</p>
                                        <p className="text-2xl font-bold text-white">S/ {currentDebt.toFixed(2)}</p>
                                        <p className="text-green-400 text-sm mt-1">Total Cobrado: S/ {totalPaid.toFixed(2)}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                    <div className="bg-gray-800 p-4 rounded-xl border border-yellow-500/30 flex flex-col items-center justify-center text-center">
                                        <p className="text-yellow-400 text-sm font-bold mb-2">⚠️ Resetear Tienda (Admin)</p>
                                        <p className="text-gray-400 text-xs mb-3">Borra todos los pedidos y pagos de Abi. Útil para empezar a operar limpio.</p>
                                        <button onClick={resetAdminPlatform} className="bg-yellow-600 text-white px-4 py-2 rounded font-bold text-sm hover:bg-yellow-700 w-full">Resetear Panel de Abi</button>
                                    </div>
                                    <div className="bg-gray-800 p-4 rounded-xl border border-red-500 flex flex-col items-center justify-center text-center">
                                        <p className="text-red-500 text-sm font-bold mb-2">🚨 Resetear Plataforma (Global)</p>
                                        <p className="text-gray-400 text-xs mb-3">Borra TODO (Pedidos, Pagos, Productos). La app queda como recién instalada.</p>
                                        <button onClick={resetGlobalPlatform} className="bg-red-800 text-white px-4 py-2 rounded font-bold text-sm hover:bg-red-900 w-full">Factory Reset (Borrar Todo)</button>
                                    </div>
                                </div>

                                <input 
                                    type="text" 
                                    placeholder="🔍 Buscar por código, cliente, estado..." 
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)} 
                                    className="w-full p-2 rounded-lg border border-gray-700 bg-gray-950 text-white text-sm mb-4 focus:outline-none focus:border-pink-500"
                                />

                                <h3 className="text-lg font-bold mb-4">Historial de Pedidos (Global)</h3>
                                <div className="space-y-2">
                                    {filteredOrders.length === 0 ? <div className="bg-gray-800 p-4 rounded-xl text-gray-500 text-center">No se encontraron pedidos.</div> : (
                                        filteredOrders.map(order => (
                                            <div key={order.id} className={`bg-gray-800 p-3 rounded-lg flex justify-between items-center text-sm border ${order.status === 'Anulado' ? 'border-red-500/50 opacity-60' : 'border-gray-700'}`}>
                                                <div>
                                                    <span className="text-pink-500 font-bold mr-2">[{order.code || 'N/A'}]</span>
                                                    <span className="text-white font-bold">{order.client}</span> - {order.items}
                                                    <p className="text-gray-500 text-xs">🕒 {new Date(order.createdAt).toLocaleString()}</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-green-400 font-bold">S/ {order.total.toFixed(2)}</p>
                                                    <span className="text-gray-400 text-xs">{order.status}</span>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </>
                        )}

                        {tab === 'pagos' && (
                            <div>
                                <h3 className="text-lg font-bold mb-4 text-pink-500">Pagos de Comisión de Abi</h3>
                                <div className="space-y-4">
                                    {payments.length === 0 ? <div className="bg-gray-800 p-4 rounded-xl text-gray-500 text-center">No hay pagos registrados.</div> : (
                                        payments.map(pay => (
                                            <div key={pay.id} className="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                                <div className="flex items-center gap-4">
                                                    <button onClick={() => setModalReceipt(pay.receipt)} className="bg-gray-900 p-2 rounded-lg text-blue-400 text-xs hover:bg-gray-950">👁️ Ver Comprobante</button>
                                                    <div>
                                                        <p className="text-white text-sm font-bold">Monto Declarado: S/ {Number(pay.amountPaid).toFixed(2)}</p>
                                                        <p className="text-gray-400 text-xs">Fecha: {pay.paymentDate}</p>
                                                        <p className="text-gray-500 text-xs">Ref: {pay.reference || 'Sin referencia'}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3 w-full md:w-auto">
                                                    {pay.status === 'Pendiente' ? (
                                                        <>
                                                            <button onClick={() => approvePayment(pay.id)} className="bg-green-500 text-white px-4 py-2 rounded font-bold text-sm w-full md:w-auto">Aprobar Pago</button>
                                                            <button onClick={() => rejectPayment(pay.id)} className="bg-red-600 text-white px-4 py-2 rounded font-bold text-sm w-full md:w-auto">Rechazar</button>
                                                        </>
                                                    ) : (
                                                        <span className={`px-4 py-2 rounded-full text-xs font-bold text-center ${pay.status === 'Aprobado' ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'}`}>{pay.status}</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {tab === 'config' && (
                            <div className="bg-gray-800 p-4 rounded-xl border border-pink-500/30">
                                <h3 className="text-lg font-bold text-white mb-4">Mi Configuración de Cobro (Comisiones)</h3>
                                <form onSubmit={saveSuperadminConfig} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="flex flex-col items-center justify-center bg-gray-950 p-4 rounded-lg">
                                        <img src={editYapeQR || "https://via.placeholder.com/150"} alt="QR Actual" className="w-32 h-32 mb-2 rounded object-cover" />
                                        <label className="text-[10px] text-pink-500 cursor-pointer hover:underline mt-1">
                                            Cambiar mi QR de Yape
                                            <input type="file" accept="image/*" onChange={handleSuperadminQRFile} className="hidden" />
                                        </label>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <div>
                                            <label className="text-xs font-bold text-gray-400 block mb-1">Mi Número de Yape</label>
                                            <input type="text" value={editYapeNumber} onChange={(e) => setEditYapeNumber(e.target.value)} placeholder="Ej: 999 111 222" className="w-full p-2 rounded-lg border border-gray-700 bg-gray-950 text-white text-sm" />
                                        </div>
                                        <button type="submit" className="bg-pink-600 text-white py-2 rounded-lg font-bold mt-2">Guardar Mi Configuración</button>
                                    </div>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
